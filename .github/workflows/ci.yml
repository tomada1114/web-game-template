name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing is inherited: every job below re-declares the scopes it needs.
permissions: {}

concurrency:
  # Superseding a pull request cancels its previous run. A push to main is
  # keyed by commit instead, so consecutive merges neither cancel one another
  # nor discard the CI record of the commit that already landed.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Package scripts call pnpm recursively, so CI installs the reviewed
      # version on PATH. No `version:` input on purpose: the action reads the
      # exact `packageManager` string from package.json, which is the single
      # place that version is written. tests/workflows.test.ts fails if a
      # workflow starts stating one again.
      #
      # It also has to run *before* setup-node: setup-node's default
      # package-manager cache resolves the pnpm store path by invoking pnpm,
      # and pnpm is only on PATH once this step has run.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The single source of coverage: it is collected exactly once across the
      # whole workflow.
      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run test:coverage

      - name: Run tests without coverage
        if: matrix.os != 'ubuntu-latest'
        run: pnpm run test

  # template-only:start
  bootstrap:
    name: Bootstrap generated repositories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated repositories
        run: pnpm run bootstrap:check
  # template-only:end

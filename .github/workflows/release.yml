name: Release

on:
  push:
    tags: ["v*.*.*"]

# Nothing is inherited: the job below re-declares the scopes it needs.
permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail -u {0}

# A tag is released exactly once; a second run for the same ref waits rather
# than cancelling a release that is already being created.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release the CrazyGames zip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # to create the GitHub Release and upload the zip
    steps:
      # Full history, so the ancestry check below can see the default branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Runs before anything is installed or built: a tag that disagrees with
      # the version would name a zip and a release after different versions.
      - name: Check the tag matches apps/web/package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The trigger glob also matches prerelease tags such as v1.2.3-rc.1,
          # which would otherwise be published as the Latest release.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG is not vMAJOR.MINOR.PATCH with digits only; a prerelease or metadata suffix is not released."
            exit 1
          fi
          if ! VERSION="$(jq -er '.version | strings' apps/web/package.json)"; then
            echo "::error::apps/web/package.json has no string version; cannot compare it with tag $TAG."
            exit 1
          fi
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match apps/web/package.json version $VERSION (expected v$VERSION)."
            exit 1
          fi

      # Only a merged commit is released: the tag goes on the merge commit.
      - name: Check the tagged commit is on the default branch
        env:
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tag $TAG points at $GITHUB_SHA, which is not on origin/$DEFAULT_BRANCH; tag the merge commit."
            exit 1
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # No dependency cache on a tag build: the release is built from the
      # lockfile alone, never from a store another run populated.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The full gate, which also writes the zip through package:crazygames.
      # Nothing is built a second time.
      - name: Run the full gate
        run: pnpm run check

      # Idempotent, so a re-run after a partly successful create still
      # attaches the zip instead of failing on "release already exists".
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" .package/*.zip --clobber
          else
            gh release create "$TAG" .package/*.zip --generate-notes
          fi
